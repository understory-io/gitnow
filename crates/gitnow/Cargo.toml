[package]
name = "gitnow"
description = "Git Now is a utility for easily navigating git projects from common upstream providers. Search, Download, and Enter projects as quickly as you can type."
edition = "2024"
readme = "../../README.md"
repository = "https://github.com/understory-io/gitnow"
homepage = "https://gitnow-client.prod.kjuulh.app"
license = "MIT"

version.workspace = true
publish = true


[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dotenvy.workspace = true

serde = { version = "1.0.197", features = ["derive"] }
uuid = { version = "1.7.0", features = ["v4"] }
async-trait = "0.1.82"
toml = "1.0.0"

reqwest = { version = "0.13", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
url = "2.5.2"
dirs = "7.0.0"
prost = "0.13.2"
prost-types = "0.13.2"
bytes = "1.7.1"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.0", features = ["termwiz"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.30"
termwiz = "0.23.0"
regex = "1.11.1"
minijinja = "2"
shell-words = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1.4.0"

[features]
example = []
